[settings]
experimental = true

[prepare.go]
auto = true

[tools]
go = "1.26.1"
golangci-lint = "latest"
sqlc = "latest"
watchexec = "latest"
caddy = "latest"
uv = "latest"
"pipx:sqlite-utils" = "latest"

[tasks.templ]
description = "Generate templ files"
run = "go tool templ generate"

[tasks.sqlc]
description = "Generate sqlc files"
run = "sqlc generate"

[tasks."build:amd64"]
description = "Build linux/amd64 binary"
depends = ["templ", "sqlc"]
run = """
CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
go build -ldflags="-s -w" -trimpath -o bin/starlite-amd64 ./cmd/www
"""

[tasks."build:local"]
description = "Build local and arm64 binary"
depends = ["templ", "sqlc"]
run = """
CGO_ENABLED=0 \
go build -gcflags="all=-N -l" -o bin/starlite ./cmd/www
"""

[tasks.build]
description = "Build all binaries"
depends = ["build:amd64", "build:local"]

[tasks.debug]
depends = ["build:local"]
run = "go tool dlv exec ./bin/starlite"
interactive = true

[tasks."live:templ"]
description = "Watch and generate templ files"
run = "go tool templ generate -watch -path internal -watch-pattern '(.+\\.templ$)' -ignore-pattern '(^|/)(db|data|tmp|bin)(/|$)'"

[tasks."live:sqlc"]
description = "Watch and generate sqlc files"
run = "watchexec -w internal/db/queries -w internal/db/migrations -e sql -- sqlc generate"

[tasks."live:reload"]
description = "Watch static files and trigger hot reload"
run = 'watchexec --postpone -w internal/static/files -e css,js,svg,png,jpg,jpeg,gif,webp,ico,md -- curl -s http://localhost:8080/hotreload || true'

[tasks."live:server"]
description = "Run air for live server reload"
run = """
go tool air -log.main_only=true \
  -build.cmd "go build -o ./tmp/bin/main ./cmd/www" \
  -build.entrypoint "./tmp/bin/main" \
  -build.exclude_dir "assets,tmp,vendor,testdata,internal/db/zz" \
  -build.exclude_regex "_test.go,_templ.go" \
  -build.include_ext "go,tpl,tmpl,templ,html,sql" \
  -misc.clean_on_exit "true"
"""

[tasks.dev]
description = "Start all dev watchers"
depends = ["live:*"]

[tasks.deploy]
description = "Build and deploy to server"
depends = ["build:amd64"]
run = "_tools/deploy.sh starlite"
